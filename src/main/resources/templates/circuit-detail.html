<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout">

<div layout:fragment="content">

    <style>
        .circuit-wrap {
            display: grid;
            grid-template-columns: 620px 1fr;
            gap: 30px;
            align-items: stretch; /*  두 박스 높이 자동 동일 */
        }

        .left-card, .right-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            overflow: hidden;
            height: 100%; /*  stretch랑 같이 쓰면 안정적으로 동일 높이 */
            display: flex;
            flex-direction: column;
        }

        .left-header {
            padding: 18px 18px 10px;
        }

        .circuit-title {
            margin: 0;
            font-size: 28px;
        }

        .image-box {
            padding: 0 18px 16px;
        }

        .image-box img {
            width: 100%;
            height: 420px;
            object-fit: contain;
            background: #f5f5f5;
            border-radius: 12px;
        }

        .mini-table {
            border-top: 1px solid #eee;
            margin-top: auto; /*  왼쪽 카드의 아래쪽에 info가 깔끔히 붙게 */
        }

        .mini-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            border-top: 1px solid #eee;
            font-size: 14px;
        }

        .mini-row strong {
            color: #111;
            white-space: nowrap;
        }

        .mini-row span {
            color: #444;
            text-align: right;
        }

        .right-card {
            padding: 22px;
        }

        .desc-title {
            margin: 0 0 12px;
            font-size: 23px;
        }

        .desc-text {
            margin: 0;
            line-height: 1.8;
            color: #333;
            white-space: pre-line; /*  \n 줄바꿈 적용 */
            font-size: 18px;
        }

        @media (max-width: 900px) {
            .circuit-wrap {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <a href="/circuits">← 서킷 목록</a>

    <div class="circuit-wrap">

        <!--  왼쪽: 이름 + 사진 + 정보 4줄 -->
        <div class="left-card">
            <div class="left-header">
                <h1 class="circuit-title" th:text="${circuit.fullname}">서킷 이름</h1>
            </div>

            <div class="image-box">
                <!-- 대표 이미지 1장(첫 장) -->
                <img th:if="${circuit.circuitImage != null and !circuit.circuitImage.isEmpty()}"
                     th:src="${circuit.circuitImage}"
                     th:alt="${circuit.name}">
            </div>

            <div class="mini-table">
                <!-- info(Map)에서 key/value 뿌리기 -->
                <div class="mini-row" th:each="row : ${circuit.info}">
                    <strong th:text="${row.key}">항목</strong>
                    <span th:text="${row.value}">값</span>
                </div>
            </div>
        </div>

        <!--  오른쪽: 설명 -->
        <div class="right-card">
            <h3 class="desc-title">서킷 설명</h3>
            <p class="desc-text" th:text="${circuit.description}">
                설명이 여기에 나옵니다.
            </p>
            <br><br><br><br><br><br><br><br>
            <p class="desc-text">차량 적합성</p>
            <br>
            <p class="desc-text" th:text="${circuit.fitness}">차량 적합성</p>
        </div>

    </div>

</div>
</html>
